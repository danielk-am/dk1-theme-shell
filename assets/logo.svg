<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="wpds-canvas-logo-title">
	<title id="wpds-canvas-logo-title">WPDS Canvas</title>
	<!--
		The mark is the theme's own thesis at 64 units: an admin page. A brand
		field, a header band carrying a title and one primary action, and the
		paper surface below it. Nothing here is decorative, and every colour is
		a WPDS token rather than a chosen one (token names written without
		their leading double hyphen, which XML forbids inside a comment):

		#3858e9  wpds-color-background-interactive-brand-strong
		#ffffff  wpds-color-background-surface-neutral-strong
		#dbdbdb  wpds-color-stroke-surface-neutral

		Drawn to survive 16px. The two content rules and the title bar fade out
		at favicon size and the silhouette carries it: a blue band over a white
		sheet, which is what the theme puts on screen.
	-->
	<rect width="64" height="64" rx="14" fill="#3858e9"/>
	<rect x="9" y="12.5" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.6"/>
	<rect x="41" y="12.5" width="14" height="7" rx="3.5" fill="#ffffff"/>
	<rect x="9" y="26" width="46" height="29" rx="5" fill="#ffffff"/>
	<rect x="16" y="34" width="32" height="3" rx="1.5" fill="#dbdbdb"/>
	<rect x="16" y="42" width="20" height="3" rx="1.5" fill="#dbdbdb"/>
</svg>
